# Runs the SIMDA test suite (tests/run_tests.php) on every push and pull request.
# Same command as locally: php tests/run_tests.php
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: simda_db
      DB_TEST_DATABASE: simda_test_db
      DB_USERNAME: root
      DB_PASSWORD: ci-root-pass
      APP_TIMEZONE: Africa/Mogadishu
      WHATSAPP_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, bcmath, mbstring, gd, zip
          coverage: none

      - name: Run the test suite
        run: php tests/run_tests.php
